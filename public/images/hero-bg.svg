<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A10" />
      <stop offset="40%" stop-color="#0F1422" />
      <stop offset="70%" stop-color="#14111E" />
      <stop offset="100%" stop-color="#090B12" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1"/>
      <circle cx="60" cy="60" r="1.5" fill="rgba(249, 115, 22, 0.15)"/>
    </pattern>

    <!-- Fiber Glow Gradients -->
    <linearGradient id="fiberOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0" />
      <stop offset="50%" stop-color="#F97316" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FB923C" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="fiberBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Base Canvas -->
  <rect width="1920" height="1080" fill="url(#bgGrad)" />
  <rect width="1920" height="1080" fill="url(#cyberGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="350" cy="300" r="450" fill="#EA580C" fill-opacity="0.12" filter="blur(120px)"/>
  <circle cx="1500" cy="400" r="500" fill="#3B82F6" fill-opacity="0.08" filter="blur(140px)"/>
  <circle cx="960" cy="850" r="400" fill="#F97316" fill-opacity="0.07" filter="blur(100px)"/>

  <!-- Optical Wave Streams (No Text) -->
  <g opacity="0.8">
    <path d="M -100 550 C 300 350, 700 750, 1100 500 C 1500 250, 1800 650, 2100 450" fill="none" stroke="url(#fiberOrange)" stroke-width="3"/>
    <path d="M -100 580 C 320 380, 720 780, 1120 530 C 1520 280, 1820 680, 2100 480" fill="none" stroke="url(#fiberBlue)" stroke-width="2"/>
    <path d="M -100 420 C 400 620, 800 320, 1200 580 C 1600 840, 1900 420, 2100 520" fill="none" stroke="rgba(249, 115, 22, 0.15)" stroke-width="1.5" stroke-dasharray="8 12"/>
    <path d="M -100 680 C 350 480, 750 820, 1150 620 C 1550 420, 1850 720, 2100 560" fill="none" stroke="rgba(56, 189, 248, 0.12)" stroke-width="1.5" stroke-dasharray="6 10"/>
  </g>

  <!-- Pulse Nodes -->
  <circle cx="450" cy="470" r="3" fill="#F97316" />
  <circle cx="450" cy="470" r="12" fill="#F97316" fill-opacity="0.2"/>
  <circle cx="1050" cy="530" r="3" fill="#38BDF8" />
  <circle cx="1050" cy="530" r="12" fill="#38BDF8" fill-opacity="0.2"/>
  <circle cx="1550" cy="380" r="4" fill="#F97316" />
  <circle cx="1550" cy="380" r="16" fill="#F97316" fill-opacity="0.2"/>
</svg>